<!DOCTYPE html>
<html>
	<head>
	    <title>JoliTube</title>
	    <script src="data.js"></script>
	    <script src="script.js"></script>
	    <script type="module" src="src/runtime/runtimeBootstrap.js"></script>
		<script type="module" src="src/player/navigation.js"></script>
	    <script type="module" src="src/legacy/legacyBridge.js"></script>
	    <script type="module" src="src/ui/uiBootstrap.js"></script>




		<!-- Global site tag (gtag.js) - Google Analytics -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-ESDN5MBC9S"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			gtag('js', new Date());

			gtag('config', 'G-ESDN5MBC9S');
		</script>

		<meta charset="utf-8">

	    <link rel="stylesheet" href="style.css">
	    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">

	</head>

	<body>

		<div id="background">
			<div id="playerContainer">
				<div id="cropping-div" style="">
			        <div id="div-to-crop" style="">
			          <div id="player-wrapper">
			            <!-- 1. The <iframe> (and video 
			            player) will replace this <div> 
			            tag. -->
			            <div id="player"></div>
			          </div>
			        </div>
			</div>
		</div>

		<div id="backgroundPlexiglass"></div>

		<div id="alertMsg" style="display: none;"></div>

		<div id="buttonsFeedback" class="hidden">
			<div id="channelNumFeedback" class="hidden"></div>
			<div id="volumeFeedback" class="hidden">100</div>
			<div id="muteFeedback" class="hidden">100</div>
		</div>


		<header class="displayed">
			<h1 id="siteName">
				<a id="siteLogo" href="index.html"><img src="rsrc/JoliTubeLogo.svg"/></a>
			</h1>
		</header>

		<div id="channels" class="displayed">
			<h1 id="channelsTitle">
				<!--<span id="channelsCategorieBack"><</span>-->
				<span id="channelsCategorieName">Chaînes</span>
			</h1>
			<input id="searchBar" title="Search - S" type="text" placeholder="chercher une chaine" />
			<div id="menuBar">
				
			</div>
		</div>



		<div id="menuControler" class="displayed">

			<div id="progressionBarContainer">
				<input id="progressionBar" type="range" name="progressionBar" min="0" max="100" value="0" />
				<div id="webkitProgressFill"></div>
				<div id="loadingFill"></div>
			</div>

			<div id="currentChannel">
				<div id="videoData">
					<div id="currentChannelLogoContainer">
						<img id="currentChannelLogo" src="rsrc/mediaPlayer/backGreyed.png" />
					</div>
					<h1 id="currentChannelNameDisplay"></h1>
					<h2 id="currentVideoNameDisplay"></h2>
				</div>

				<div id="videoDuration" title="Backward/Forward - ← / →">
					<div id="currentVideoTime"></div>
					<div id="currentVideoTimeSeparator">&nbsp;/&nbsp;</div>
					<div id="currentVideoDuration"></div>
				</div>
			</div>

			<div id="playerControls">
				<img id="previousVideo" title="Previous video - P" src="rsrc/mediaPlayer/previous.svg" />
				<img id="playVideo" title="Play / Pause - Space" src="rsrc/mediaPlayer/play.svg" />
				<img id="nextVideo" title="Next video - N" src="rsrc/mediaPlayer/next.svg" />
			</div>

			<div id="advancedControls">
				<div id="settingsControls">
					<select id="selectResolution" name="selectResolution" disabled></select>
					<select id="selectSpeed"  title="Playback speed - X" name="selectSpeed">
						<option value='0.25'>x 0.25</option>
						<option value='0.5'>x 0.5</option>
						<option value='1' selected>x 1</option>
						<option value='1.5'>x 1.5</option>
						<option value='2'>x 2</option>
					</select>
					<select id="selectSubtitles" name="selectSubtitles" style="display:none;"></select>
				</div>
				<div id="modeControls">
					<img id="mute"  title="Mute / Unmute - M" src="rsrc/mediaPlayer/sound-3.svg" />
					<div id="volumeBarContainer">
						<input id="volume"  title="Volume - ↑ / ↓" type="range" name="volume" min="0" max="100" value="100" />
						<div id="webkitProgressFillVolume"></div>
					</div>
					<img id="fillingmode" title="Theater / Fill mode - T" src="rsrc/mediaPlayer/fill-mode.svg" />
					<img id="fullscreen" title="Fullscreen - F" src="rsrc/mediaPlayer/fullscreen-on.svg" />
				</div>
			</div>
		</div>
	</body>
</html>
